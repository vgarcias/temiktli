[package]
name = "temiktli-shell"
description = "Temiktli: editor visual de HTML y CSS para escritorio."
version = "0.1.0-rc.1"
license = "MIT"
repository = "https://github.com/vgarcias/temiktli"
authors = ["vgarcias"]
edition = "2024"

[dependencies]
dirs = "6"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tao = "0.37.2"
temiktli-core = { version = "0.1.0-rc.1", path = "../temiktli-core" }
trash = "5.2.9"
wry = "0.57.1"

[build-dependencies]
winresource = "0.1"
