[package]
name = "temiktli-shell"
description = "Temiktli: editor visual de HTML y CSS para escritorio."
version = "0.1.0-rc.1"
license = "MIT"
repository = "https://github.com/vgarcias/temiktli"
authors = ["vgarcias"]
edition = "2024"

[dependencies]
dirs = "6"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tao = "0.37.2"
temiktli-core = { version = "0.1.0-rc.1", path = "../temiktli-core" }
trash = "5.2.9"
wry = "0.57.1"

[build-dependencies]
winresource = "0.1"

[package.metadata.packager]
product-name = "Temiktli"
identifier = "io.github.vgarcias.temiktli"
publisher = "vgarcias"
homepage = "https://github.com/vgarcias/temiktli"
category = "DeveloperTool"
long-description = "Editor visual de HTML y CSS para escritorio."
license-file = "../../LICENSE"
out-dir = "../../dist/packager"
binaries-dir = "../../target/release"
binaries = [{ path = "temiktli-shell", main = true }]
icons = ["assets/icon.ico", "assets/icon-512.png", "assets/icon.icns"]
before-packaging-command = "cargo build --release -p temiktli-shell"

[package.metadata.packager.nsis]
installer-mode = "currentUser"

[package.metadata.packager.deb]
depends = ["libwebkit2gtk-4.1-0", "libgtk-3-0"]
