<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>/*I18N_JS*/</script>
<title data-i18n="panel.page_title"></title>
<style>
  :root {
    --bg: #f6f6f8; --panel: #fff; --fg: #1f2328; --muted: #6b7280; --line: #d8dbe0;
    --accent: #2563eb; --danger: #b42318; --field: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1d21; --panel: #24272c; --fg: #e6e8eb; --muted: #9aa1ab; --line: #383c43;
      --accent: #5b8def; --danger: #f97066; --field: #1b1d21;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg); display: flex; flex-direction: column;
    font: 13px/1.4 system-ui, "Segoe UI", sans-serif; overflow: hidden;
  }
  header { padding: 8px 10px; border-bottom: 1px solid var(--line); background: var(--panel); }
  #file { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  main { flex: 1; overflow-y: auto; padding: 10px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
            padding: 10px; margin-bottom: 10px; }
  h2 { margin: 0 0 8px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
       color: var(--muted); }
  button {
    font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line);
    border-radius: 4px; padding: 3px 8px; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  button.danger { color: var(--danger); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  input, textarea, select {
    font: inherit; color: var(--fg); background: var(--field); border: 1px solid var(--line);
    border-radius: 4px; padding: 3px 6px; width: 100%;
  }
  input:focus, textarea:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
  textarea { min-height: 64px; resize: vertical; }
  #inner { font: 12px/1.4 ui-monospace, "Cascadia Mono", Consolas, monospace; min-height: 96px; }
  .field-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 8px 0 3px; }
  .field-head .field-title { margin: 0; }
  .field-head label { display: flex; align-items: center; gap: 4px; color: var(--muted); font-size: 12px; cursor: pointer; }
  .field-head input[type="checkbox"] { width: auto; margin: 0; }
  #path { color: var(--muted); font: 12px ui-monospace, Consolas, monospace; margin-bottom: 8px;
          word-break: break-word; line-height: 1.7; }
  /* Cada tramo de la ruta es un botón que selecciona ese elemento. */
  #path .crumb { background: none; border: 0; border-radius: 3px; padding: 0 3px; margin: 0; height: auto;
                 font: inherit; color: inherit; cursor: pointer; width: auto; }
  #path .crumb:hover { background: color-mix(in srgb, currentColor 14%, transparent); color: var(--fg, inherit); }
  #path .crumb.cur { font-weight: 700; color: var(--fg, inherit); cursor: default; }
  #path .crumb.cur:hover { background: none; }
  #path .sep { opacity: .55; user-select: none; }
  .row { display: grid; grid-template-columns: 84px 1fr 24px; gap: 4px; margin-bottom: 4px;
         align-items: center; }
  .row label { color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
  .row button { padding: 0; height: 24px; }
  .row.view { grid-template-columns: 84px 1fr; }
  .newrow { display: grid; grid-template-columns: 84px 1fr 24px; gap: 4px; margin-top: 6px; }
  .field-title { color: var(--muted); margin: 8px 0 3px; }
  .rule { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 8px; }
  .rule:first-child { border-top: 0; padding-top: 0; margin-top: 0; }
  .rule .sel { font: 12px ui-monospace, Consolas, monospace; word-break: break-word; margin-bottom: 4px; }
  .rule .ctx { color: var(--muted); font-size: 11px; margin-bottom: 4px; }
  .rule .row { grid-template-columns: 96px 1fr 24px; }
  .rule .row label { font: 12px ui-monospace, Consolas, monospace; }
  .rule .imp { color: var(--muted); font-size: 11px; }
  .empty { color: var(--muted); }
  .tree { max-height: 220px; overflow: auto; }
  .tree .f { display: flex; align-items: center; gap: 4px; padding: 1px 2px; border-radius: 3px; white-space: nowrap; }
  .tree .f:hover { background: var(--bg); }
  .tree .name { background: none; border: 0; padding: 0; text-align: left; color: var(--fg);
                overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; cursor: pointer; }
  .tree .name:hover:not(:disabled) { color: var(--accent); }
  .tree .name:disabled { color: var(--muted); cursor: default; opacity: 1; }
  .tree .dir { color: var(--muted); cursor: pointer; }
  .tree .cur { font-weight: 600; }
  .tree .dot { color: var(--accent); }
  .tree .mini { padding: 0 6px; height: 20px; font-size: 11px; }
  .tree .f { outline: none; }
  .tree .f.sel { background: color-mix(in srgb, var(--accent) 18%, transparent); }
  .tree input.rn { flex: 1; min-width: 0; padding: 0 4px; height: 20px; }
  #ctx { position: fixed; z-index: 10; min-width: 150px; padding: 3px; background: var(--panel);
         border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
  #ctx[hidden] { display: none; }
  #ctx button { display: flex; justify-content: space-between; gap: 16px; width: 100%; border: 0;
                background: none; padding: 4px 8px; text-align: left; }
  #ctx button:hover { background: var(--bg); }
  #ctx .key { color: var(--muted); }
  .files-new { grid-template-columns: 1fr auto; margin-bottom: 6px; }
  .files-new button { padding: 3px 10px; }
  footer { padding: 5px 10px; border-top: 1px solid var(--line); background: var(--panel);
           color: var(--muted); min-height: 26px; }
  footer.err { color: var(--danger); }
</style>
</head>
<body>
<main>
  <section>
    <h2 data-i18n="panel.insert.title"></h2>
    <div class="grid" id="insert"></div>
  </section>
  <section>
    <h2 data-i18n="panel.props.title"></h2>
    <div id="props"><div class="empty" data-i18n="panel.props.empty"></div></div>
  </section>
  <section>
    <h2 data-i18n="panel.files.title"></h2>
    <div id="files"><div class="empty" data-i18n="panel.files.no_folder"></div></div>
    <div class="newrow files-new">
      <input id="newfile" data-i18n-placeholder="panel.files.new_placeholder" spellcheck="false"
             data-i18n-title="panel.files.new_title">
      <button id="create" data-i18n="panel.files.create" data-i18n-title="panel.files.create_title"></button>
    </div>
    <div class="bar"><button id="refresh" data-i18n="panel.files.refresh" data-i18n-title="panel.files.refresh_title"></button></div>
  </section>
  <section>
    <h2 data-i18n="panel.styles.title"></h2>
    <div id="rules"><div class="empty" data-i18n="panel.styles.empty"></div></div>
  </section>
</main>
<div id="ctx" hidden>
  <button id="ctx-rename" data-i18n-title="panel.files.rename_title"><span data-i18n="panel.files.rename"></span><span class="key">F2</span></button>
  <button id="ctx-delete" data-i18n-title="panel.files.delete_title"><span data-i18n="panel.files.delete"></span><span class="key" data-i18n="keys.delete"></span></button>
</div>
<footer id="status"></footer>

<script>
(function () {
  const { t } = window.__i18n;
  window.__i18n.apply(document);
  const send = (msg) => window.ipc.postMessage(JSON.stringify(msg));
  const $ = (id) => document.getElementById(id);

  // ---------- Insertar ----------
  const TAGS = ['main', 'header', 'nav', 'section', 'article', 'footer',
    'h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'p', 'ul', 'ol', 'li', 'hr', 'a', 'button', 'img', 'span', 'br', 'div', 'form'];
  for (const tag of TAGS) {
    const b = document.createElement('button');
    b.textContent = tag;
    b.title = t('panel.insert.tag_title', { tag });
    b.addEventListener('click', () => send({ type: 'Insert', tag }));
    $('insert').appendChild(b);
  }

  // ---------- Archivos de la carpeta del sitio ----------
  let files = [];
  const collapsed = new Set();
  let filesSig = '';
  let lastState = null;
  let selPath = null;   // elemento seleccionado en la lista (para F2 / Supr)
  let renaming = null;  // ruta que se está renombrando en línea

  const ext =(p) => (p.split('.').pop() || '').toLowerCase();
  const IMAGE_EXTS = ['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg', 'avif', 'ico', 'bmp'];

  function renderFiles(s) {
    if (s.files) files = s.files;
    const box = $('files');
    if (!s.has_folder) {
      filesSig = '';
      box.replaceChildren(el('div', { className: 'empty', textContent: t('panel.files.no_folder') }));
      return;
    }
    if (selPath && !files.some((f) => f.path === selPath)) selPath = null;
    if (renaming && !files.some((f) => f.path === renaming)) renaming = null;
    const sig = JSON.stringify([files, [...collapsed], s.file_name, s.css_open, s.active_file, selPath, renaming]);
    if (sig === filesSig) return;
    filesSig = sig;
    const tree = el('div', { className: 'tree' });
    const cssState = new Map(s.css_open.map((c) => [c.path, c]));
    for (const f of files) {
      const parts = f.path.split('/');
      // Oculto si alguna carpeta que lo contiene está plegada.
      let hidden = false;
      for (let i = 1; i < parts.length; i++) if (collapsed.has(parts.slice(0, i).join('/'))) hidden = true;
      if (hidden) continue;
      const row = el('div', { className: 'f' + (f.path === selPath ? ' sel' : ''), tabIndex: -1 });
      row.dataset.path = f.path;
      row.style.paddingLeft = (parts.length - 1) * 14 + 2 + 'px';
      const name = parts[parts.length - 1];
      row.addEventListener('click', () => { if (selPath !== f.path) selectRow(f.path); });
      row.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        selectRow(f.path);
        showMenu(e.clientX, e.clientY, f.path);
      });
      if (f.is_dir) {
        const open = !collapsed.has(f.path);
        row.append(el('span', { className: 'dir', textContent: (open ? '▾ ' : '▸ ') + name }));
        row.addEventListener('click', () => {
          if (collapsed.has(f.path)) collapsed.delete(f.path); else collapsed.add(f.path);
          renderFiles(lastState);
        });
      } else {
        const kind = ext(f.path);
        const isHtml = kind === 'html' || kind === 'htm';
        const isImage = IMAGE_EXTS.includes(kind);
        const css = cssState.get(f.path);
        const btn = el('button', {
          className: 'name' + (f.path === s.file_name ? ' cur' : ''),
          title: isImage ? t('panel.files.insert_image_title', { path: f.path }) : f.path,
          disabled: !(isHtml || kind === 'css' || isImage),
        });
        if (css && css.dirty) btn.append(el('span', { className: 'dot', textContent: '● ' }));
        btn.append(isImage ? '🖼 ' + name : name);
        if (isHtml) btn.addEventListener('click', () => send({ type: 'OpenPath', path: f.path }));
        else if (kind === 'css') btn.addEventListener('click', () => send({ type: 'OpenCss', path: f.path }));
        else if (isImage) btn.addEventListener('click', () => send({ type: 'InsertImage', path: f.path }));
        row.append(btn);
        if (kind === 'css') {
          const link = el('button', { className: 'mini', textContent: t('panel.files.link'), title: t('panel.files.link_title') });
          link.addEventListener('click', () => send({ type: 'LinkCss', path: f.path }));
          row.append(link);
        }
      }
      if (f.path === renaming) row.replaceChildren(renameInput(f, name));
      tree.append(row);
    }
    box.replaceChildren(files.length ? tree : el('div', { className: 'empty', textContent: t('panel.files.empty_folder') }));
    if (renaming) {
      const input = box.querySelector('input.rn');
      if (input) {
        input.focus();
        const dot = input.value.lastIndexOf('.');
        input.setSelectionRange(0, dot > 0 && input.dataset.dir !== '1' ? dot : input.value.length);
      }
    }
  }

  // Campo para cambiar el nombre en la propia fila: Enter confirma, Esc o perder el foco cancelan.
  function renameInput(f, name) {
    const input = el('input', { className: 'rn', value: name, spellcheck: false, title: t('panel.files.rename_hint') });
    input.dataset.dir = f.is_dir ? '1' : '0';
    const finish = (commit) => {
      if (renaming !== f.path) return;
      renaming = null;
      const value = input.value.trim();
      if (commit && value && value !== name) send({ type: 'RenamePath', path: f.path, new_name: value });
      renderFiles(lastState);
      focusRow();
    };
    input.addEventListener('keydown', (e) => {
      e.stopPropagation();
      if (e.key === 'Enter') { e.preventDefault(); finish(true); }
      else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
    });
    input.addEventListener('blur', () => { if (input.isConnected) finish(false); });
    return input;
  }

  function focusRow() {
    const row = [...$('files').querySelectorAll('.f')].find((r) => r.dataset.path === selPath);
    if (row && !renaming) row.focus({ preventScroll: true });
  }

  function selectRow(path) {
    selPath = path;
    renderFiles(lastState);
    focusRow();
  }

  function startRename(path) {
    if (!path) return;
    selPath = path;
    renaming = path;
    renderFiles(lastState);
  }

  function deletePath(path) {
    if (path) send({ type: 'DeletePath', path });
  }

  // Menú contextual de la lista (clic derecho) con los mismos comandos que F2 / Supr.
  const ctx = $('ctx');
  let ctxPath = null;
  function showMenu(x, y, path) {
    ctxPath = path;
    ctx.hidden = false;
    ctx.style.left = Math.max(2, Math.min(x, window.innerWidth - ctx.offsetWidth - 4)) + 'px';
    ctx.style.top = Math.max(2, Math.min(y, window.innerHeight - ctx.offsetHeight - 4)) + 'px';
  }
  function hideMenu() { ctx.hidden = true; ctxPath = null; }
  $('ctx-rename').addEventListener('click', () => { const p = ctxPath; hideMenu(); startRename(p); });
  $('ctx-delete').addEventListener('click', () => { const p = ctxPath; hideMenu(); deletePath(p); });
  document.addEventListener('mousedown', (e) => { if (!ctx.hidden && !ctx.contains(e.target)) hideMenu(); });
  window.addEventListener('blur', hideMenu);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !ctx.hidden) hideMenu(); });
  // F2 / Supr solo actúan con el foco dentro de la lista y sin un campo de texto enfocado.
  $('files').addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || !selPath) return;
    if (e.key === 'F2') { e.preventDefault(); startRename(selPath); }
    else if (e.key === 'Delete') { e.preventDefault(); deletePath(selPath); }
  });
  $('refresh').addEventListener('click', () => send({ type: 'RefreshFiles' }));

  const createFile = () => {
    const path = $('newfile').value.trim();
    if (!path) return;
    send({ type: 'NewFile', path });
    $('newfile').value = '';
  };
  $('create').addEventListener('click', createFile);
  $('newfile').addEventListener('keydown', (e) => { if (e.key === 'Enter') createFile(); });

  // ---------- Propiedades ----------
  let lastSig = null;

  function el(tag, props, ...kids) {
    const e = Object.assign(document.createElement(tag), props || {});
    kids.forEach((k) => e.append(k));
    return e;
  }

  // Un valor vacío quita el atributo, salvo alt="" que es significativo (imagen decorativa).
  function commitAttr(id, name, value) {
    const v = value === '' && name !== 'alt' ? null : value;
    send({ type: 'SetAttr', id, name, value: v });
  }

  // Ajuste de línea del cuadro Contenido (HTML); por defecto activado (el panel es estrecho).
  let wrapInner = true;
  try { wrapInner = localStorage.getItem('tk-wrap-inner') !== '0'; } catch (_) { /* sin almacenamiento */ }

  // La ruta del elemento (html › body › div.hero › h1): cada tramo selecciona ese elemento en el
  // lienzo y marca su etiqueta en el editor de HTML (el mismo `Select` que un clic en el lienzo).
  function fillPath(box, sel) {
    const key = sel.crumbs.map((c) => c.id + ':' + c.label).join('|');
    if (box.dataset.key === key) return; // sin cambios: no se reconstruye
    box.dataset.key = key;
    box.title = sel.path;
    box.replaceChildren();
    sel.crumbs.forEach((c, i) => {
      if (i) box.append(el('span', { className: 'sep', textContent: ' › ' }));
      const last = i === sel.crumbs.length - 1;
      const b = el('button', {
        className: 'crumb' + (last ? ' cur' : ''),
        textContent: c.label,
        title: last ? t('panel.props.crumb_current') : t('panel.props.crumb_select', { label: c.label }),
      });
      if (!last) b.addEventListener('click', () => send({ type: 'Select', id: c.id }));
      box.append(b);
    });
  }

  function buildProps(sel) {
    const box = $('props');
    box.replaceChildren();
    const path = el('div', { id: 'path' });
    fillPath(path, sel);
    box.append(path);

    sel.attrs.forEach(([name, value]) => {
      const input = el('input', { value, spellcheck: false });
      input.dataset.attr = name;
      input.addEventListener('change', () => commitAttr(sel.id, name, input.value));
      const rm = el('button', { textContent: '×', title: t('panel.props.remove_attr') });
      rm.addEventListener('click', () => send({ type: 'SetAttr', id: sel.id, name, value: null }));
      box.append(el('div', { className: 'row' }, el('label', { textContent: name, title: name }), input, rm));
    });

    const n = el('input', { placeholder: t('panel.props.attr_placeholder'), spellcheck: false });
    const v = el('input', { placeholder: t('panel.props.value_placeholder'), spellcheck: false });
    const add = el('button', { textContent: '+', title: t('panel.props.add_attr') });
    const addAttr = () => {
      const name = n.value.trim();
      if (!name) return;
      commitAttr(sel.id, name, v.value);
      n.value = ''; v.value = '';
    };
    add.addEventListener('click', addAttr);
    v.addEventListener('keydown', (e) => { if (e.key === 'Enter') addAttr(); });
    box.append(el('div', { className: 'newrow' }, n, v, add));

    if (sel.text !== null) {
      const ta = el('textarea', { value: sel.text, spellcheck: false });
      ta.id = 'text';
      ta.addEventListener('change', () => send({ type: 'EditText', id: sel.id, text: ta.value }));
      box.append(el('div', { className: 'field-title', textContent: t('panel.props.text') }), ta);
    }

    if (sel.inner_html !== null) {
      const ta = el('textarea', { value: sel.inner_html, spellcheck: false });
      ta.id = 'inner';
      // Al confirmar, Rust valida el HTML. Si lo rechaza (avisa en la barra de estado) el
      // texto escrito se queda para poder corregirlo; si lo acepta, el elemento se
      // reconstruye con otro id y este cuadro se vuelve a crear.
      ta.addEventListener('change', () => {
        ta.dataset.edited = '1';
        send({ type: 'SetInner', id: sel.id, html: ta.value });
      });
      // Ajuste de línea: lo elegido se recuerda para los demás elementos y la próxima vez.
      ta.wrap = wrapInner ? 'soft' : 'off';
      const wrapBox = el('input', { type: 'checkbox', checked: wrapInner });
      wrapBox.addEventListener('change', () => {
        wrapInner = wrapBox.checked;
        ta.wrap = wrapInner ? 'soft' : 'off';
        try { localStorage.setItem('tk-wrap-inner', wrapInner ? '1' : '0'); } catch (_) { /* sin almacenamiento */ }
      });
      box.append(
        el('div', { className: 'field-head' },
          el('div', { className: 'field-title', textContent: t('panel.props.inner'), title: t('panel.props.inner_title') }),
          el('label', { title: t('panel.props.wrap_title') },
            wrapBox, t('panel.props.wrap'))),
        ta,
      );
    } else if (sel.inner_large) {
      box.append(el('div', { className: 'field-title', textContent: t('panel.props.inner') }),
        el('div', { className: 'empty', textContent: t('panel.props.inner_too_large') }));
    }

    const del = el('button', { className: 'danger', textContent: t('panel.props.delete'), disabled: !sel.can_delete });
    del.style.marginTop = '10px';
    del.addEventListener('click', () => send({ type: 'Delete' }));
    box.append(del);
  }

  // Actualiza los valores sin reconstruir (conserva foco y cursor mientras se escribe).
  function syncProps(sel) {
    fillPath($('path'), sel);
    document.querySelectorAll('input[data-attr]').forEach((i, idx) => {
      if (document.activeElement !== i) i.value = sel.attrs[idx][1];
    });
    const ta = $('text');
    if (ta && document.activeElement !== ta) ta.value = sel.text;
    // Un HTML rechazado no se pisa con el original: así se puede corregir.
    const inner = $('inner');
    if (inner && document.activeElement !== inner && !inner.dataset.edited) inner.value = sel.inner_html;
  }

  function renderProps(sel) {
    if (!sel) {
      lastSig = null;
      $('props').replaceChildren(el('div', { className: 'empty', textContent: t('panel.props.empty') }));
      return;
    }
    const sig = [sel.id, sel.can_delete, sel.text === null, sel.inner_html === null, sel.inner_large,
      ...sel.attrs.map((a) => a[0])].join('|');
    if (sig === lastSig) syncProps(sel);
    else { buildProps(sel); lastSig = sig; }
  }

  // ---------- Estilos: reglas CSS que afectan al elemento ----------
  let rulesSig = null;

  // Una regla vive en un <style> del documento o en un archivo .css vinculado.
  function setDecl(r, name, value) {
    if (r.file) send({ type: 'SetFileDecl', path: r.file, rule: r.index, name, value });
    else send({ type: 'SetDecl', style: r.style, rule: r.index, name, value });
  }

  function buildRules(rules) {
    const box = $('rules');
    box.replaceChildren();
    for (const r of rules) {
      const card = el('div', { className: 'rule' });
      card.append(el('div', { className: 'sel', textContent: r.selector }));
      if (r.context) card.append(el('div', { className: 'ctx', textContent: r.context }));
      card.append(el('div', {
        className: 'ctx',
        textContent: r.file ? t('panel.styles.file', { file: r.file }) : t('panel.styles.inline'),
        title: r.file || t('panel.styles.inline_title'),
      }));
      r.decls.forEach((d) => {
        const input = el('input', { value: d.value, spellcheck: false });
        input.dataset.decl = (r.file || r.style) + ':' + r.index + ':' + d.name;
        input.addEventListener('change', () => setDecl(r, d.name, input.value.trim() === '' ? null : input.value));
        const rm = el('button', { textContent: '×', title: t('panel.styles.remove_decl') });
        rm.addEventListener('click', () => setDecl(r, d.name, null));
        const label = el('label', { textContent: d.name, title: d.name });
        card.append(el('div', { className: 'row' }, label, input, rm));
      });
      const n = el('input', { placeholder: t('panel.styles.prop_placeholder'), spellcheck: false });
      const v = el('input', { placeholder: t('panel.styles.value_placeholder'), spellcheck: false });
      const add = el('button', { textContent: '+', title: t('panel.styles.add_decl') });
      const addDecl = () => {
        const name = n.value.trim();
        if (!name || !v.value.trim()) return;
        setDecl(r, name, v.value);
        n.value = ''; v.value = '';
      };
      add.addEventListener('click', addDecl);
      v.addEventListener('keydown', (e) => { if (e.key === 'Enter') addDecl(); });
      card.append(el('div', { className: 'newrow' }, n, v, add));
      box.append(card);
    }
  }

  function renderRules(sel, rules) {
    const box = $('rules');
    if (!sel) {
      rulesSig = null;
      box.replaceChildren(el('div', { className: 'empty', textContent: t('panel.styles.empty') }));
      return;
    }
    if (rules.length === 0) {
      rulesSig = null;
      box.replaceChildren(el('div', { className: 'empty', textContent: t('panel.styles.none') }));
      return;
    }
    const sig = rules.map((r) => [r.file || r.style, r.index, r.selector, r.context, ...r.decls.map((d) => d.name)].join('|')).join('||');
    if (sig !== rulesSig) { buildRules(rules); rulesSig = sig; return; }
    // Misma estructura: solo se refrescan los valores que no se están editando.
    rules.forEach((r) => r.decls.forEach((d) => {
      const i = box.querySelector('input[data-decl="' + (r.file || r.style) + ':' + r.index + ':' + d.name + '"]');
      if (i && document.activeElement !== i) i.value = d.value;
    }));
  }

  window.__panel = {
    update(s) {
      const st = $('status');
      st.textContent = s.status;
      st.className = s.status.startsWith('⚠') ? 'err' : '';
      lastState = s;
      renderFiles(s);
      renderProps(s.selection);
      renderRules(s.selection, s.rules);
    },
  };

  document.addEventListener('keydown', (e) => {
    const mod = e.ctrlKey || e.metaKey;
    const k = e.key.toLowerCase();
    const tag = document.activeElement && document.activeElement.tagName;
    const typing = tag === 'INPUT' || tag === 'TEXTAREA';
    let msg = null;
    if (mod && k === 's') msg = e.shiftKey ? 'SaveAs' : 'Save';
    else if (mod && k === 'o') msg = 'Open';
    else if (!typing && mod && k === 'z') msg = e.shiftKey ? 'Redo' : 'Undo';
    else if (!typing && mod && k === 'y') msg = 'Redo';
    if (msg) { e.preventDefault(); send({ type: msg }); }
  });

  send({ type: 'Ready' });
})();
</script>
</body>
</html>
