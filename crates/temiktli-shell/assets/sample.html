<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Página de prueba</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; color: #222; }
    .hero { padding: 48px 32px; background: #eef3ff; }
    .hero h1 { margin: 0 0 8px; }
    .cards { display: flex; gap: 16px; padding: 32px; }
    .card { flex: 1; padding: 16px; border: 1px solid #ccd; border-radius: 8px; }
  </style>
</head>
<body>
  <header class="hero">
    <h1>Hola, Temiktli</h1>
    <p>Haz clic en cualquier elemento para seleccionarlo.</p>
  </header>
  <main class="cards">
    <section class="card"><h2>Uno</h2><p>Primer bloque con <a href="https://example.com">un enlace</a>.</p></section>
    <section class="card"><h2>Dos</h2><p>Segundo bloque.</p></section>
  </main>
</body>
</html>
